<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eventflow — Project Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070f;--surface:#0f0f1a;--surface2:#151525;--border:#1c1c2e;--border2:#252538;
  --text:#e8e8f5;--text2:#9898b8;--text3:#55556a;
  --accent:#6c63ff;--accent2:#8b7fff;--green:#22d3a0;--red:#ff4d6a;--amber:#ffb83f;--blue:#3d9eff;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
input,textarea,select,button{font-family:var(--font);}
button{cursor:pointer;}
.app{display:flex;height:100vh;overflow:hidden;}
/* SIDEBAR */
.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;}
.sidebar.collapsed{width:52px;}
.logo{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.logo-text{font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;}
.nav{flex:1;overflow-y:auto;padding:10px 8px;}
.nav-label{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:8px 10px 4px;}
.nav-item{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-size:12.5px;font-weight:400;text-align:left;transition:all .15s;cursor:pointer;white-space:nowrap;overflow:hidden;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(108,99,255,.14);color:var(--accent2);font-weight:600;}
.nav-item .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:700;}
.proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.user-area{padding:10px 8px;border-top:1px solid var(--border);}
.user-card{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.avatar.sm{width:24px;height:24px;font-size:9px;}
.avatar.lg{width:44px;height:44px;font-size:15px;}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;}
.topbar-title{flex:1;font-size:14px;font-weight:600;color:var(--text2);}
.icon-btn{border:none;background:var(--surface2);color:var(--text2);width:34px;height:34px;border-radius:8px;font-size:15px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);transition:all .15s;position:relative;}
.icon-btn:hover{border-color:var(--border2);color:var(--text);}
.red-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--surface);}
.page{flex:1;overflow-y:auto;padding:26px 30px;}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
.card-pad{padding:18px 20px;}
/* CHIPS */
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
/* INPUTS */
.inp{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border .15s;}
.inp:focus{border-color:var(--accent);}
.inp-label{display:block;font-size:10px;font-weight:700;color:var(--text3);margin-bottom:5px;letter-spacing:.07em;text-transform:uppercase;}
.field{margin-bottom:14px;}
/* BUTTONS */
.btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-green{background:rgba(34,211,160,.15);border:1px solid rgba(34,211,160,.3);color:var(--green);}
.btn-red{background:rgba(255,77,106,.15);border:1px solid rgba(255,77,106,.3);color:var(--red);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:26px;width:100%;max-width:460px;animation:pop .2s ease;}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-title{font-size:15px;font-weight:700;}
.close-btn{border:none;background:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;}
.close-btn:hover{color:var(--text);}
/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:500;z-index:9999;animation:pop .2s ease;}
.toast.success{background:var(--green);color:#07070f;}
.toast.error{background:var(--red);color:#fff;}
/* LOADING */
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-in{animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
/* STAT CARD */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-val{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:6px;}
.stat-label{font-size:11px;color:var(--text2);margin-top:3px;}
/* TABLE */
.trow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);transition:background .1s;}
.trow:last-child{border-bottom:none;}
.trow:hover{background:var(--surface2);}
.trow-btn{width:100%;text-align:left;border:none;background:transparent;cursor:pointer;}
/* NOTIF DROPDOWN */
.notif-drop{position:absolute;top:calc(100% + 8px);right:0;width:290px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;z-index:200;overflow:hidden;}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;}
/* TAG */
.tag{font-size:10px;color:var(--text3);font-family:var(--mono);}
/* CHAT BUBBLE */
.bubble{padding:9px 13px;border-radius:10px;font-size:12.5px;line-height:1.55;max-width:80%;}
.bubble.mine{background:rgba(108,99,255,.18);border:1px solid rgba(108,99,255,.2);align-self:flex-end;}
.bubble.theirs{background:var(--surface2);border:1px solid var(--border);}
/* PROGRESS BAR */
.pbar{height:3px;background:var(--border2);border-radius:2px;overflow:hidden;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s;}
/* SEARCH */
.search-box{position:relative;}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:9px;margin-top:4px;z-index:300;overflow:hidden;max-height:260px;overflow-y:auto;}
.sr-item{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.sr-item:hover{background:var(--surface2);}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ============================================================
// SUPABASE CLIENT
// ============================================================
const { createClient } = supabase;
const SUPA_URL = 'https://ovkmfeczuvwddqtpbovv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92a21mZWN6dXZ3ZGRxdHBib3Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjc4NzksImV4cCI6MjA5NTkwMzg3OX0.lU3r39McwuZq8fK319-VDkXp7zm4yWWEiKOGj5y-xl4';
const db = createClient(SUPA_URL, SUPA_KEY);

// ============================================================
// STATE
// ============================================================
let state = {
  user: null, view: 'login',
  projects: [], workspaces: [], tasks: [], users: [], comments: [],
  wsNotes: [], activityLog: [], notifications: [],
  selProject: null, selWorkspace: null, selTask: null,
  loading: false, modal: null, toast: null,
  sidebarOpen: true, showNotifDrop: false,
  searchQ: '', searchResults: [], showSearch: false
};

function setState(patch){ Object.assign(state, patch); render(); }

// ============================================================
// DB HELPERS
// ============================================================
async function loadAll(){
  if(!state.user) return;
  setState({loading:true});
  try{
    const [p,w,t,u,c,wn,al,no] = await Promise.all([
      db.from('projects').select('*').order('created_at',{ascending:false}),
      db.from('workspaces').select('*').order('created_at'),
      db.from('tasks').select('*').order('created_at'),
      db.from('users').select('id,name,email,role,avatar,shadow_notes,created_at'),
      db.from('comments').select('*').order('created_at'),
      db.from('workspace_notes').select('*').order('created_at',{ascending:false}),
      db.from('activity_log').select('*').order('created_at',{ascending:false}).limit(100),
      db.from('notifications').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false})
    ]);
    setState({
      projects: p.data||[], workspaces: w.data||[], tasks: t.data||[],
      users: u.data||[], comments: c.data||[], wsNotes: wn.data||[],
      activityLog: al.data||[], notifications: no.data||[], loading:false
    });
  }catch(e){ setState({loading:false}); showToast('Load error: '+e.message,'error'); }
}

async function logAct(action){
  await db.from('activity_log').insert({user_id:state.user.id,user_name:state.user.name,action});
}
async function pushNotif(userId, text){
  await db.from('notifications').insert({user_id:userId,text});
}
async function markNotifsRead(){
  await db.from('notifications').update({is_read:true}).eq('user_id',state.user.id);
  setState({notifications: state.notifications.map(n=>({...n,is_read:true}))});
}

// ============================================================
// UTILITIES
// ============================================================
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function ini(name){ return name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtTime(ts){ return new Date(ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function priorityColor(p){ return p==='High'?'var(--red)':p==='Medium'?'var(--amber)':'var(--green)'; }
function statusColor(s){
  if(s==='Completed') return 'var(--green)';
  if(s==='In Progress') return 'var(--blue)';
  if(s==='Awaiting Approval') return 'var(--amber)';
  if(s==='Overdue') return 'var(--red)';
  return 'var(--text3)';
}
function projStatusColor(s){
  if(s==='Active') return 'var(--green)';
  if(s==='Planning') return 'var(--accent)';
  if(s==='On Hold') return 'var(--amber)';
  if(s==='Completed') return 'var(--blue)';
  return 'var(--text3)';
}
function showToast(msg, type='success'){
  setState({toast:{msg,type}});
  setTimeout(()=>setState({toast:null}),3000);
}
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='style' && typeof v==='object') Object.assign(e.style, v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='className') e.className = v;
    else e.setAttribute(k, v);
  }
  for(const c of children){
    if(c==null) continue;
    if(typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else if(c instanceof Node) e.appendChild(c);
    else if(Array.isArray(c)) c.forEach(x=>x instanceof Node&&e.appendChild(x));
  }
  return e;
}
function h(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstChild; }

// ============================================================
// VIEWS HELPERS
// ============================================================
function myProjects(){
  if(state.user?.role==='admin') return state.projects;
  return state.projects.filter(p=>(p.assigned_team||[]).includes(state.user?.id));
}
function wsForProject(pid){ return state.workspaces.filter(w=>w.project_id===pid); }
function tasksForWs(wsId){
  const ts = state.tasks.filter(t=>t.workspace_id===wsId);
  if(state.user?.role==='admin') return ts;
  return ts.filter(t=>t.assigned_to===state.user?.id);
}
function commentsForTask(tid){ return state.comments.filter(c=>c.task_id===tid); }
function notesForWs(wsId){ return state.wsNotes.filter(n=>n.workspace_id===wsId); }
function getUserById(id){ return state.users.find(u=>u.id===id); }
function unreadCount(){ return state.notifications.filter(n=>!n.is_read).length; }
function allMyTasks(){
  const ts = state.user?.role==='admin' ? state.tasks : state.tasks.filter(t=>t.assigned_to===state.user?.id);
  return ts;
}

// ============================================================
// RENDER ENGINE
// ============================================================
function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  if(state.view==='login'){ root.appendChild(renderLogin()); return; }
  const app = el('div',{className:'app'});
  if(state.sidebarOpen!==false) app.appendChild(renderSidebar());
  const main = el('div',{className:'main'});
  main.appendChild(renderTopbar());
  const page = el('div',{className:'page fade-in'});
  if(state.loading && state.view!=='login'){
    page.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text2)"><div class="spinner"></div> Loading...</div>';
  } else {
    switch(state.view){
      case 'dashboard': page.appendChild(renderDashboard()); break;
      case 'project': if(state.selProject) page.appendChild(renderProject()); break;
      case 'task': if(state.selTask) page.appendChild(renderTask()); break;
      case 'employees': if(state.user?.role==='admin') page.appendChild(renderEmployees()); break;
      case 'activity': if(state.user?.role==='admin') page.appendChild(renderActivity()); break;
      case 'archive': if(state.user?.role==='admin') page.appendChild(renderArchive()); break;
    }
  }
  main.appendChild(page);
  app.appendChild(main);
  root.appendChild(app);
  if(state.modal) root.appendChild(renderModal());
  if(state.toast) root.appendChild(renderToast());
}

// ============================================================
// LOGIN
// ============================================================
function renderLogin(){
  const wrap = el('div',{style:{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',position:'relative'}});
  wrap.innerHTML=`
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(108,99,255,.12) 0%,transparent 60%);pointer-events:none;"></div>
    <div style="width:380px;animation:pop .4s ease;">
      <div style="text-align:center;margin-bottom:32px;">
        <div style="width:46px;height:46px;background:var(--accent);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px;">◈</div>
        <h1 style="font-size:24px;font-weight:700;letter-spacing:-.03em;">Eventflow</h1>
        <p style="color:var(--text2);font-size:12px;margin-top:5px;">Project management for event professionals</p>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;">
        <div class="field">
          <label class="inp-label">Email</label>
          <input id="login-email" class="inp" placeholder="your@email.com" value="admin@company.com"/>
        </div>
        <div class="field">
          <label class="inp-label">Password</label>
          <input id="login-pass" type="password" class="inp" placeholder="••••••••" value="admin123"/>
        </div>
        <button id="login-btn" class="btn btn-primary" style="width:100%;margin-top:4px;">Sign In</button>
        <div style="margin-top:18px;padding:11px 13px;background:var(--bg);border-radius:8px;font-size:11px;color:var(--text3);line-height:1.8;">
          <strong style="color:var(--text2);">Demo login:</strong><br/>
          Admin: admin@company.com / admin123
        </div>
      </div>
    </div>
  `;
  wrap.querySelector('#login-btn').onclick = doLogin;
  wrap.querySelector('#login-pass').onkeydown = e => e.key==='Enter'&&doLogin();
  return wrap;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  setState({loading:true});
  const {data,error} = await db.from('users').select('*').eq('email',email).eq('password',pass).single();
  if(error||!data){ setState({loading:false}); showToast('Invalid email or password','error'); return; }
  state.user = data;
  setState({view:'dashboard',loading:false});
  await logAct('Logged in');
  await loadAll();
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar(){
  const isAdmin = state.user?.role==='admin';
  const sb = el('div',{className:'sidebar'+(state.sidebarOpen?'':' collapsed')});
  // Logo
  const logo = el('div',{className:'logo'});
  logo.appendChild(el('div',{className:'logo-icon'},'◈'));
  if(state.sidebarOpen) logo.appendChild(el('div',{className:'logo-text'},'Eventflow'));
  sb.appendChild(logo);

  const nav = el('div',{className:'nav'});
  const navItems = [
    {label:'Dashboard',icon:'⌂',view:'dashboard'},
    ...(isAdmin?[{label:'Team',icon:'◎',view:'employees'}]:[]),
    ...(isAdmin?[{label:'Activity Log',icon:'◷',view:'activity'}]:[]),
    ...(isAdmin?[{label:'Archive',icon:'⊞',view:'archive'}]:[]),
  ];
  if(state.sidebarOpen) nav.appendChild(el('div',{className:'nav-label'},'Navigation'));
  navItems.forEach(ni=>{
    const btn = el('button',{className:'nav-item'+(state.view===ni.view?' active':''),onClick:()=>{
      setState({view:ni.view,selProject:null,selTask:null});
    }});
    btn.appendChild(el('span',{className:'icon'},ni.icon));
    if(state.sidebarOpen) btn.appendChild(el('span',{},ni.label));
    nav.appendChild(btn);
  });

  // Projects
  if(state.sidebarOpen){
    const projects = myProjects();
    nav.appendChild(el('div',{className:'nav-label',style:{display:'flex',justifyContent:'space-between',alignItems:'center',paddingRight:'10px'}},
      el('span',{},'Projects'),
      ...(isAdmin?[el('button',{style:{border:'none',background:'none',color:'var(--accent)',fontSize:'18px',cursor:'pointer',lineHeight:1},onClick:()=>setState({modal:{type:'createProject'}})},'+')]:[])
    ));
    projects.forEach(p=>{
      const btn = el('button',{className:'nav-item',onClick:()=>{
        setState({view:'project',selProject:p,selTask:null,selWorkspace:null});
      }});
      btn.appendChild(el('div',{className:'proj-dot',style:{background:projStatusColor(p.status)}}));
      btn.appendChild(el('span',{style:{overflow:'hidden',textOverflow:'ellipsis'}},p.name));
      nav.appendChild(btn);
    });
    if(!projects.length) nav.appendChild(el('div',{style:{padding:'6px 10px',fontSize:'11px',color:'var(--text3)'}},isAdmin?'Create your first project':'No projects assigned'));
  }
  sb.appendChild(nav);

  // User area
  const ua = el('div',{className:'user-area'});
  const uc = el('div',{className:'user-card'});
  const av = el('div',{className:'avatar'},state.user?.avatar||ini(state.user?.name||'?'));
  uc.appendChild(av);
  if(state.sidebarOpen){
    const info = el('div',{style:{flex:1,overflow:'hidden'}});
    info.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'600',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},state.user?.name));
    info.appendChild(el('div',{style:{fontSize:'10px',color:'var(--accent)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.05em'}},state.user?.role));
    uc.appendChild(info);
    uc.appendChild(el('button',{style:{border:'none',background:'none',color:'var(--text3)',fontSize:'15px',cursor:'pointer'},onClick:doLogout,title:'Logout'},'⎋'));
  }
  ua.appendChild(uc);
  sb.appendChild(ua);
  return sb;
}

function doLogout(){
  state.user=null; state.view='login'; state.projects=[]; state.tasks=[]; state.users=[];
  render();
}

// ============================================================
// TOPBAR
// ============================================================
function renderTopbar(){
  const tb = el('div',{className:'topbar'});
  tb.appendChild(el('button',{className:'icon-btn',onClick:()=>setState({sidebarOpen:!state.sidebarOpen})},'☰'));

  // Breadcrumb title
  let title = '';
  if(state.view==='dashboard') title='Dashboard';
  else if(state.view==='project') title=state.selProject?.name||'Project';
  else if(state.view==='task') title=state.selTask?.title||'Task';
  else if(state.view==='employees') title='Team Members';
  else if(state.view==='activity') title='Activity Log';
  else if(state.view==='archive') title='Archive';
  tb.appendChild(el('div',{className:'topbar-title'},title));

  // Search
  const searchWrap = el('div',{className:'search-box'});
  if(state.showSearch){
    const sinp = el('input',{className:'inp',placeholder:'Search projects, tasks, people...',style:{width:'260px',padding:'7px 12px',fontSize:'12px'},value:state.searchQ});
    sinp.oninput = e => {
      state.searchQ = e.target.value;
      const q = e.target.value.toLowerCase();
      if(q.length<2){ state.searchResults=[]; render(); return; }
      const res=[];
      myProjects().forEach(p=>{
        if(p.name.toLowerCase().includes(q)) res.push({icon:'◈',title:p.name,sub:'Project',action:()=>setState({view:'project',selProject:p,selTask:null,showSearch:false,searchQ:''})});
        state.tasks.filter(t=>state.user?.role==='admin'||t.assigned_to===state.user?.id).forEach(t=>{
          if(t.title.toLowerCase().includes(q)){
            const ws=state.workspaces.find(w=>w.id===t.workspace_id);
            res.push({icon:'✓',title:t.title,sub:p.name,action:()=>setState({view:'task',selTask:t,selProject:p,selWorkspace:ws,showSearch:false,searchQ:''})});
          }
        });
      });
      if(state.user?.role==='admin') state.users.filter(u=>u.role==='employee'&&u.name.toLowerCase().includes(q)).forEach(u=>res.push({icon:'◎',title:u.name,sub:'Employee',action:()=>setState({view:'employees',showSearch:false,searchQ:''})}));
      state.searchResults=res.slice(0,7);
      render();
      document.querySelector('.search-box input')?.focus();
    };
    sinp.onblur = ()=>{ if(!state.searchQ) setTimeout(()=>setState({showSearch:false}),200); };
    searchWrap.appendChild(sinp);
    if(state.searchResults.length){
      const drop=el('div',{className:'search-results'});
      state.searchResults.forEach(r=>{
        const it=el('div',{className:'sr-item',onClick:r.action});
        it.innerHTML=`<span style="color:var(--accent);font-size:13px;">${r.icon}</span><div><div style="font-size:12px;font-weight:600;">${r.title}</div><div style="font-size:10px;color:var(--text3);">${r.sub}</div></div>`;
        drop.appendChild(it);
      });
      searchWrap.appendChild(drop);
    }
  } else {
    const sbtn=el('button',{className:'icon-btn',style:{width:'auto',padding:'0 14px',gap:'8px',fontSize:'12px',display:'flex',alignItems:'center'},onClick:()=>setState({showSearch:true})});
    sbtn.innerHTML='⌕ <span>Search</span>';
    searchWrap.appendChild(sbtn);
  }
  tb.appendChild(searchWrap);

  // Notifications
  const nb=el('button',{className:'icon-btn',onClick:()=>{ setState({showNotifDrop:!state.showNotifDrop}); if(!state.showNotifDrop) markNotifsRead(); }},'🔔');
  if(unreadCount()>0) nb.appendChild(el('div',{className:'red-dot'}));
  const nwrap=el('div',{style:{position:'relative'}});
  nwrap.appendChild(nb);
  if(state.showNotifDrop){
    const drop=el('div',{className:'notif-drop'});
    drop.innerHTML=`<div style="padding:11px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;">Notifications</div>`;
    const notifs=state.notifications.slice(0,8);
    if(!notifs.length) drop.innerHTML+=`<div style="padding:16px;text-align:center;font-size:12px;color:var(--text3);">No notifications</div>`;
    notifs.forEach(n=>{
      const ni=el('div',{className:'notif-item',style:{background:n.is_read?'transparent':'rgba(108,99,255,.06)'}});
      ni.innerHTML=`<div style="font-size:12px;color:${n.is_read?'var(--text2)':'var(--text)'};">${n.text}</div><div style="font-size:10px;color:var(--text3);margin-top:3px;">${fmtTime(n.created_at)}</div>`;
      drop.appendChild(ni);
    });
    nwrap.appendChild(drop);
  }
  tb.appendChild(nwrap);
  return tb;
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(){
  const isAdmin=state.user?.role==='admin';

  const myTasks=allMyTasks();

  wrap.appendChild(g);

  // Stats
  const statsGrid=el('div',{className:'grid4',style:{marginBottom:'26px'}});

    {label:'Active Projects',val:projects.filter(p=>p.status==='Active').length,icon:'▶',color:'var(--green)'},

    {label:'Awaiting Approval',val:myTasks.filter(t=>t.status==='Awaiting Approval').length,icon:'◷',color:'var(--amber)'},

  stats.forEach(s=>{

    sc.innerHTML=`<div style="color:${s.color};font-size:18px;">${s.icon}</div><div class="stat-val">${s.val}</div><div class="stat-label">${s.label}</div>`;

  });
  wrap.appendChild(statsGrid);

  // Body grid
  const body=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 360px',gap:'18px'}});

  // Projects list
  const pl=el('div',{});
  const ph=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'13px'}});
  ph.appendChild(el('div',{style:{fontSize:'14px',fontWeight:'600',color:'var(--text2)'}},isAdmin?'All Projects':'Your Projects'));
  if(isAdmin) ph.appendChild(el('button',{className:'btn btn-primary btn-sm',onClick:()=>setState({modal:{type:'createProject'}})},'+  New Project'));
  pl.appendChild(ph);
  if(!projects.length) pl.appendChild(el('div',{className:'card card-pad',style:{color:'var(--text3)',fontSize:'12px',textAlign:'center',padding:'30px'}},isAdmin?'No projects yet. Create one →':'No projects assigned to you.'));
  projects.forEach(p=>{
    const ws=wsForProject(p.id);
    const allPTasks=ws.flatMap(w=>state.tasks.filter(t=>t.workspace_id===w.id));
    const myPTasks=isAdmin?allPTasks:allPTasks.filter(t=>t.assigned_to===state.user?.id);
    const done=myPTasks.filter(t=>t.status==='Completed').length;
    const pct=myPTasks.length?Math.round(done/myPTasks.length*100):0;
    const team=(p.assigned_team||[]).map(id=>getUserById(id)).filter(Boolean);
    const card=el('div',{className:'card',style:{marginBottom:'8px',padding:'15px 18px',cursor:'pointer',transition:'border-color .15s'},onClick:()=>setState({view:'project',selProject:p,selTask:null})});
    card.innerHTML=`
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;">
        <div><div style="font-size:13.5px;font-weight:600;">${p.name}</div>${p.client?`<div style="font-size:11px;color:var(--text2);margin-top:2px;">${p.client}</div>`:''}</div>
        <span class="chip" style="background:${projStatusColor(p.status)}20;color:${projStatusColor(p.status)};">${p.status}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div class="pbar" style="flex:1;"><div class="pbar-fill" style="width:${pct}%;"></div></div>
        <span style="font-size:10px;color:var(--text3);font-family:var(--mono);">${done}/${myPTasks.length}</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;">${team.slice(0,4).map(u=>`<div class="avatar sm" style="margin-left:-3px;border:2px solid var(--surface);">${u.avatar||ini(u.name)}</div>`).join('')}</div>
        <span style="font-size:10px;color:var(--text3);">Due ${fmtDate(p.end_date)}</span>
      </div>`;
    pl.appendChild(card);
  });
  body.appendChild(pl);

  // Right panel
  const rp=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});
  // Tasks needing action
  const tcard=el('div',{className:'card card-pad'});
  tcard.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'600',marginBottom:'13px'}},isAdmin?'Awaiting Approval':'Your Active Tasks'));
  const relevantTasks = isAdmin ? myTasks.filter(t=>t.status==='Awaiting Approval') : myTasks.filter(t=>['Pending','In Progress'].includes(t.status)).slice(0,6);
  if(!relevantTasks.length) tcard.appendChild(el('div',{style:{color:'var(--text3)',fontSize:'12px',padding:'6px 0'}},'Nothing here'));
  relevantTasks.forEach(t=>{
    const proj=state.projects.find(p=>state.workspaces.find(w=>w.id===t.workspace_id&&w.project_id===p.id));
    const ws=state.workspaces.find(w=>w.id===t.workspace_id);
    const row=el('button',{className:'trow trow-btn',onClick:()=>setState({view:'task',selTask:t,selProject:proj,selWorkspace:ws})});
    row.innerHTML=`<div style="width:7px;height:7px;border-radius:50%;background:${priorityColor(t.priority)};flex-shrink:0;"></div><div style="flex:1;overflow:hidden;"><div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.title}</div><div style="font-size:10px;color:var(--text3);">${proj?.name||''}</div></div><span class="chip" style="background:${statusColor(t.status)}20;color:${statusColor(t.status)};">${t.status}</span>`;
    tcard.appendChild(row);
  });
  rp.appendChild(tcard);

  // Recent activity (admin)
  if(isAdmin){
    const ac=el('div',{className:'card card-pad'});
    ac.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'600',marginBottom:'13px'}},'Recent Activity'));
    state.activityLog.slice(0,6).forEach(log=>{
      const row=el('div',{style:{padding:'7px 0',borderBottom:'1px solid var(--border)'}});
      row.innerHTML=`<div style="font-size:12px;color:var(--text2);">${log.action}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">${log.user_name} · ${fmtTime(log.created_at)}</div>`;
      ac.appendChild(row);
    });
    rp.appendChild(ac);
  }
  body.appendChild(rp);
  wrap.appendChild(body);
  return wrap;
}

function renderProject(){
  const p=state.selProject;
  const isAdmin=state.user?.role==='admin';
  const workspaces=wsForProject(p.id);
  if(!state.selWorkspace && workspaces.length) state.selWorkspace=workspaces[0];
  const ws=state.selWorkspace;
  const wrap=el('div',{style:{maxWidth:'1060px'}});

  // Header
  const hdr=el('div',{className:'card card-pad',style:{marginBottom:'18px'}});
  const htop=el('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}});
  const hleft=el('div',{});
  hleft.innerHTML=`<h1 style="font-size:19px;font-weight:700;letter-spacing:-.02em;">${p.name}</h1>${p.client?`<div style="font-size:12px;color:var(--text2);margin-top:2px;">Client: ${p.client}</div>`:''}<div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;"><span class="chip" style="background:${projStatusColor(p.status)}20;color:${projStatusColor(p.status)};">${p.status}</span><span style="font-size:11px;color:var(--text3);">📅 ${fmtDate(p.start_date)} → ${fmtDate(p.end_date)}</span></div>`;
  htop.appendChild(hleft);
  if(isAdmin){
    const btns=el('div',{style:{display:'flex',gap:'8px'}});
    btns.appendChild(el('button',{className:'btn btn-primary btn-sm',onClick:()=>setState({modal:{type:'createTask',project:p,workspace:ws}})},'+  Task'));
    btns.appendChild(el('button',{className:'btn btn-ghost btn-sm',onClick:()=>setState({modal:{type:'createWorkspace',project:p}})},'+  Month'));
    htop.appendChild(btns);
  }
  hdr.appendChild(htop);
  if(isAdmin&&p.description){
    const dn=el('div',{style:{marginTop:'12px',padding:'9px 13px',background:'rgba(108,99,255,.06)',border:'1px solid rgba(108,99,255,.18)',borderRadius:'8px',fontSize:'12px',color:'var(--text2)',borderLeft:'3px solid var(--accent)'}});
    dn.textContent='🔒 '+p.description;
    hdr.appendChild(dn);
  }
  wrap.appendChild(hdr);

  // Workspace tabs
  if(workspaces.length){
    const tabs=el('div',{style:{display:'flex',gap:'4px',marginBottom:'16px',overflowX:'auto'}});
    workspaces.forEach(wsTab=>{
      const btn=el('button',{className:'btn '+(state.selWorkspace?.id===wsTab.id?'btn-primary':'btn-ghost'),style:{fontSize:'12px',padding:'7px 14px',whiteSpace:'nowrap'},onClick:()=>setState({selWorkspace:wsTab})});
      btn.textContent=wsTab.month+(wsTab.status==='archived'?' 📦':'');
      tabs.appendChild(btn);
    });
    wrap.appendChild(tabs);
  }

  if(!ws){
    wrap.appendChild(el('div',{className:'card card-pad',style:{textAlign:'center',color:'var(--text3)',fontSize:'13px',padding:'40px'}},'No workspaces yet. '+(isAdmin?'Add a monthly workspace above.':'')));
    return wrap;
  }

  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr '+(isAdmin?'270px':''),gap:'16px'}});

  // Tasks
  const tl=el('div',{});
  const th=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}});
  const tasks=tasksForWs(ws.id);
  th.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--text2)'}},'Tasks  ·  '+tasks.length));
  if(isAdmin) th.appendChild(el('button',{className:'btn btn-ghost btn-sm',onClick:()=>setState({modal:{type:'createTask',project:p,workspace:ws}})},'+  Add Task'));
  tl.appendChild(th);
  if(!tasks.length) tl.appendChild(el('div',{className:'card card-pad',style:{color:'var(--text3)',fontSize:'12px',textAlign:'center',padding:'28px'}},'No tasks in this workspace'));
  tasks.forEach(t=>{
    const assignee=getUserById(t.assigned_to);
    const row=el('div',{className:'card',style:{marginBottom:'7px',padding:'11px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:'12px',transition:'border-color .15s'},onClick:()=>setState({view:'task',selTask:t,selProject:p,selWorkspace:ws})});
    row.innerHTML=`<div style="width:9px;height:9px;border-radius:50%;background:${priorityColor(t.priority)};flex-shrink:0;"></div><div style="flex:1;overflow:hidden;"><div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.title}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">Due ${fmtDate(t.due_date)}</div></div>${assignee?`<div class="avatar sm" title="${assignee.name}">${assignee.avatar||ini(assignee.name)}</div>`:''}<span class="chip" style="background:${statusColor(t.status)}20;color:${statusColor(t.status)};">${t.status}</span>`;
    tl.appendChild(row);
  });
  grid.appendChild(tl);

  // Admin notes panel
  if(isAdmin){
    const np=el('div',{className:'card card-pad'});
    np.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:12px;display:flex;align-items:center;gap:6px;">🔒 Private Notes <span style="font-size:10px;font-weight:400;color:var(--text3);">(only you see this)</span></div>`;
    const notes=notesForWs(ws.id);
    const nl=el('div',{style:{maxHeight:'200px',overflowY:'auto',marginBottom:'12px'}});
    if(!notes.length) nl.appendChild(el('div',{style:{color:'var(--text3)',fontSize:'11px'}},'No notes yet'));
    notes.forEach(n=>{
      const ni=el('div',{style:{padding:'7px 0',borderBottom:'1px solid var(--border)'}});
      ni.innerHTML=`<div style="font-size:12px;color:var(--text2);">${n.text}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">${fmtTime(n.created_at)}</div>`;
      nl.appendChild(ni);
    });
    np.appendChild(nl);
    const ta=el('textarea',{className:'inp',placeholder:'Add private note...',style:{resize:'none',fontSize:'12px',marginBottom:'8px'}});
    ta.rows=3;
    np.appendChild(ta);
    const saveBtn=el('button',{className:'btn btn-ghost btn-sm',style:{width:'100%'},onClick:async()=>{
      if(!ta.value.trim()) return;
      await db.from('workspace_notes').insert({workspace_id:ws.id,author_id:state.user.id,text:ta.value.trim()});
      await logAct('Added note to '+ws.month+' workspace');
      showToast('Note saved!');
      await loadAll();
    }},'Save Note');
    np.appendChild(saveBtn);
    grid.appendChild(np);
  }

  wrap.appendChild(grid);
  return wrap;
}

// TASK VIEW
// ============================================================
function renderTask(){
  const t=state.selTask;
  const p=state.selProject;
  const ws=state.selWorkspace;
  const isAdmin=state.user?.role==='admin';
  const comments=commentsForTask(t.id);
  const assignee=getUserById(t.assigned_to);
  const wrap=el('div',{style:{maxWidth:'820px'}});

  // Header
  const hdr=el('div',{className:'card card-pad',style:{marginBottom:'16px'}});
  const htop=el('div',{style:{display:'flex',alignItems:'flex-start',gap:'16px'}});
  const hleft=el('div',{style:{flex:1}});
  hleft.innerHTML=`<h1 style="font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;">${t.title}</h1><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;"><span class="chip" style="background:${statusColor(t.status)}20;color:${statusColor(t.status)};">${t.status}</span><span class="chip" style="background:${priorityColor(t.priority)}20;color:${priorityColor(t.priority)};">${t.priority}</span><span style="font-size:11px;color:var(--text3);">📅 Due ${fmtDate(t.due_date)}</span>${assignee?`<span style="font-size:11px;color:var(--text3);">👤 ${assignee.name}</span>`:''}</div>`;
  htop.appendChild(hleft);

  // Action buttons
  const abts=el('div',{style:{display:'flex',gap:'8px',flexShrink:0}});
  if(!isAdmin&&t.status==='Pending'){
    abts.appendChild(el('button',{className:'btn btn-sm',style:{background:'rgba(61,158,255,.15)',border:'1px solid rgba(61,158,255,.3)',color:'var(--blue)'},onClick:()=>updateTaskStatus('In Progress')},'▶ Start'));
  }
  if(!isAdmin&&t.status==='In Progress'){
    abts.appendChild(el('button',{className:'btn btn-sm',style:{background:'rgba(255,184,63,.15)',border:'1px solid rgba(255,184,63,.3)',color:'var(--amber)'},onClick:()=>updateTaskStatus('Awaiting Approval')},'Request Approval'));
  }
  if(isAdmin&&t.status==='Awaiting Approval'){
    abts.appendChild(el('button',{className:'btn btn-green btn-sm',onClick:approveTask},'✓ Approve'));
    abts.appendChild(el('button',{className:'btn btn-red btn-sm',onClick:rejectTask},'✗ Reject'));
  }
  htop.appendChild(abts);
  hdr.appendChild(htop);
  wrap.appendChild(hdr);

  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr '+(isAdmin?'255px':''),gap:'14px'}});

  // Workspace / comments
  const wspace=el('div',{className:'card card-pad'});
  wspace.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'600',marginBottom:'14px'}},'Workspace'));
  const msgs=el('div',{style:{maxHeight:'320px',overflowY:'auto',marginBottom:'14px',display:'flex',flexDirection:'column',gap:'10px'}});
  if(!comments.length) msgs.appendChild(el('div',{style:{fontSize:'12px',color:'var(--text3)'}},'No updates yet. Add the first comment.'));
  comments.forEach(c=>{
    const isMe=c.author_id===state.user?.id;
    const auth=getUserById(c.author_id);
    const row=el('div',{style:{display:'flex',gap:'9px',justifyContent:isMe?'flex-end':'flex-start'}});
    if(!isMe){
      const av=el('div',{className:'avatar sm'},auth?.avatar||ini(auth?.name||'?'));
      row.appendChild(av);
    }
    const bwrap=el('div',{style:{maxWidth:'80%'}});
    bwrap.innerHTML=`<div style="font-size:10px;color:var(--text3);margin-bottom:3px;">${auth?.name||c.author_name} · ${fmtTime(c.created_at)}</div>`;
    const bub=el('div',{className:'bubble '+(isMe?'mine':'theirs')},c.text);
    bwrap.appendChild(bub);
    row.appendChild(bwrap);
    msgs.appendChild(row);
  });
  wspace.appendChild(msgs);
  const cinp=el('div',{style:{display:'flex',gap:'8px'}});
  const ctextarea=el('input',{className:'inp',placeholder:'Add update or comment...',style:{flex:1,fontSize:'12px'}});
  ctextarea.onkeydown=e=>e.key==='Enter'&&addComment(ctextarea);
  cinp.appendChild(ctextarea);
  cinp.appendChild(el('button',{className:'btn btn-primary btn-sm',onClick:()=>addComment(ctextarea)},'Send'));
  wspace.appendChild(cinp);
  grid.appendChild(wspace);

  // Admin notes
  if(isAdmin){
    const an=el('div',{className:'card card-pad',style:{border:'1px solid rgba(108,99,255,.2)'}});
    an.innerHTML=`<div style="font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:10px;">🔒 Admin Notes</div>`;
    const nota=el('textarea',{className:'inp',style:{resize:'none',fontSize:'12px',marginBottom:'8px'}});
    nota.rows=6; nota.value=t.admin_notes||'';
    nota.placeholder='Internal notes (employee never sees this)...';
    an.appendChild(nota);
    an.appendChild(el('button',{className:'btn btn-primary btn-sm',style:{width:'100%'},onClick:async()=>{
      await db.from('tasks').update({admin_notes:nota.value}).eq('id',t.id);
      state.selTask={...t,admin_notes:nota.value};
      showToast('Notes saved!');
      await loadAll();
    }},'Save Notes'));
    grid.appendChild(an);
  }

  wrap.appendChild(grid);
  return wrap;
}

async function updateTaskStatus(status){
  const t=state.selTask;
  await db.from('tasks').update({status}).eq('id',t.id);
  await logAct(`Updated task status: ${t.title} → ${status}`);
  if(status==='Awaiting Approval'){
    const admin=state.users.find(u=>u.role==='admin');
    if(admin) await pushNotif(admin.id,`${state.user.name} requested approval: ${t.title}`);
  }
  state.selTask={...t,status};
  showToast('Status updated to '+status);
  await loadAll();
}
async function approveTask(){
  const t=state.selTask;
  await db.from('tasks').update({status:'Completed'}).eq('id',t.id);
  await logAct(`Approved task: ${t.title}`);
  if(t.assigned_to) await pushNotif(t.assigned_to,`Your task was approved: ${t.title}`);
  state.selTask={...t,status:'Completed'};
  showToast('Task approved! ✓');
  await loadAll();
}
async function rejectTask(){
  const t=state.selTask;
  await db.from('tasks').update({status:'In Progress'}).eq('id',t.id);
  await logAct(`Rejected/revised task: ${t.title}`);
  if(t.assigned_to) await pushNotif(t.assigned_to,`Task sent back for revision: ${t.title}`);
  state.selTask={...t,status:'In Progress'};
  showToast('Task sent back for revision');
  await loadAll();
}
async function addComment(inp){
  if(!inp.value.trim()) return;
  await db.from('comments').insert({task_id:state.selTask.id,author_id:state.user.id,author_name:state.user.name,text:inp.value.trim(),is_admin:state.user.role==='admin'});
  await logAct(`Added comment on: ${state.selTask.title}`);
  if(state.user.role==='admin'&&state.selTask.assigned_to){
    await pushNotif(state.selTask.assigned_to,`Admin commented on: ${state.selTask.title}`);
  }
  inp.value='';
  showToast('Comment added!');
  await loadAll();
}

// ============================================================
// EMPLOYEES VIEW
// ============================================================
function renderEmployees(){
  const employees=state.users.filter(u=>u.role==='employee');
  const wrap=el('div',{style:{maxWidth:'980px'}});
  const ph=el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}});
  ph.appendChild(el('h2',{style:{fontSize:'18px',fontWeight:'700',letterSpacing:'-.02em'}},'Team Members'));
  ph.appendChild(el('button',{className:'btn btn-primary',onClick:()=>setState({modal:{type:'createEmployee'}})},'+  Add Employee'));
  wrap.appendChild(ph);

  if(!employees.length){
    wrap.appendChild(el('div',{className:'card card-pad',style:{textAlign:'center',color:'var(--text3)',padding:'40px'}},'No employees yet. Add one above.'));
    return wrap;
  }

  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'270px 1fr',gap:'16px'}});
  if(!state._selEmp) state._selEmp=employees[0];
  const empList=el('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
  employees.forEach(emp=>{
    const empTasks=state.tasks.filter(t=>t.assigned_to===emp.id);
    const card=el('div',{className:'card',style:{padding:'13px 15px',cursor:'pointer',border:'1px solid '+(state._selEmp?.id===emp.id?'rgba(108,99,255,.4)':'var(--border)'),transition:'border-color .15s'},onClick:()=>{state._selEmp=emp;render();}});
    card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;"><div class="avatar">${emp.avatar||ini(emp.name)}</div><div><div style="font-size:13px;font-weight:600;">${emp.name}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">${empTasks.length} tasks · ${empTasks.filter(t=>t.status==='Completed').length} done</div></div></div>`;
    empList.appendChild(card);
  });
  grid.appendChild(empList);

  // Employee detail
  const emp=state._selEmp;
  const detail=el('div',{className:'card card-pad'});
  detail.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div style="display:flex;gap:13px;align-items:center;">
        <div class="avatar lg">${emp.avatar||ini(emp.name)}</div>
        <div><div style="font-size:17px;font-weight:700;">${emp.name}</div><div style="font-size:12px;color:var(--text2);margin-top:2px;">${emp.email}</div></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="reset-pw-btn">Reset Password</button>
    </div>
    <div style="padding:12px 14px;background:rgba(108,99,255,.06);border:1px solid rgba(108,99,255,.15);border-radius:9px;margin-bottom:16px;">
      <div style="font-size:10px;font-weight:700;color:var(--accent2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em;">🔒 Internal Record</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.6;" id="shadow-note-text">${emp.shadow_notes||'No internal notes'}</div>
      <button style="margin-top:7px;border:none;background:none;color:var(--accent);font-size:11px;cursor:pointer;" id="edit-shadow-btn">Edit record →</button>
    </div>
  `;
  detail.querySelector('#reset-pw-btn').onclick=()=>setState({modal:{type:'resetPassword',employee:emp}});
  detail.querySelector('#edit-shadow-btn').onclick=()=>setState({modal:{type:'editShadowNote',employee:emp}});

  const taskTitle=el('div',{style:{fontSize:'13px',fontWeight:'600',marginBottom:'10px'}},'Assigned Tasks');
  detail.appendChild(taskTitle);
  const empTasks=state.tasks.filter(t=>t.assigned_to===emp.id);
  if(!empTasks.length) detail.appendChild(el('div',{style:{color:'var(--text3)',fontSize:'12px'}},'No tasks assigned'));
  empTasks.forEach(t=>{
    const proj=state.projects.find(p=>state.workspaces.find(w=>w.id===t.workspace_id&&w.project_id===p.id));
    const row=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',background:'var(--bg)',borderRadius:'7px',marginBottom:'5px'}});
    row.innerHTML=`<div style="width:6px;height:6px;border-radius:50%;background:${priorityColor(t.priority)};flex-shrink:0;"></div><div style="flex:1;"><div style="font-size:12px;">${t.title}</div><div style="font-size:10px;color:var(--text3);">${proj?.name||''} · Due ${fmtDate(t.due_date)}</div></div><span class="chip" style="background:${statusColor(t.status)}20;color:${statusColor(t.status)};">${t.status}</span>`;
    detail.appendChild(row);
  });
  grid.appendChild(detail);
  wrap.appendChild(grid);
  return wrap;
}

// ============================================================
// ACTIVITY VIEW
// ============================================================
function renderActivity(){
  const wrap=el('div',{style:{maxWidth:'780px'}});
  wrap.appendChild(el('h2',{style:{fontSize:'18px',fontWeight:'700',marginBottom:'20px',letterSpacing:'-.02em'}},'Activity Log'));
  const card=el('div',{className:'card',style:{overflow:'hidden'}});
  if(!state.activityLog.length) card.innerHTML='<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px;">No activity yet</div>';
  state.activityLog.forEach(log=>{
    const row=el('div',{style:{display:'flex',gap:'13px',padding:'11px 18px',borderBottom:'1px solid var(--border)',alignItems:'flex-start'}});
    row.innerHTML=`<div class="avatar sm" style="margin-top:2px;">${ini(log.user_name||'?')}</div><div style="flex:1;"><div style="font-size:13px;"><strong>${log.user_name}</strong> ${log.action}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">${fmtTime(log.created_at)}</div></div>`;
    card.appendChild(row);
  });
  wrap.appendChild(card);
  return wrap;
}

// ============================================================
// ARCHIVE VIEW
// ============================================================
function renderArchive(){
  const wrap=el('div',{style:{maxWidth:'780px'}});
  wrap.appendChild(el('h2',{style:{fontSize:'18px',fontWeight:'700',marginBottom:'20px',letterSpacing:'-.02em'}},'Archive'));
  const archived=state.workspaces.filter(w=>w.status==='archived');
  if(!archived.length){
    wrap.appendChild(el('div',{className:'card card-pad',style:{textAlign:'center',color:'var(--text3)',padding:'40px',fontSize:'13px'}},'No archived workspaces yet.\nClose a monthly workspace to archive it.'));
    return wrap;
  }
  archived.forEach(ws=>{
    const proj=state.projects.find(p=>p.id===ws.project_id);
    const tasks=state.tasks.filter(t=>t.workspace_id===ws.id);
    const card=el('div',{className:'card card-pad',style:{marginBottom:'8px'}});
    card.innerHTML=`<div style="font-size:13px;font-weight:600;">📦 ${ws.month} — ${proj?.name||''}</div><div style="font-size:11px;color:var(--text3);margin-top:4px;">${tasks.length} tasks archived · Closed ${fmtTime(ws.created_at)}</div>`;
    wrap.appendChild(card);
  });
  return wrap;
}

// ============================================================
// MODALS
// ============================================================
function renderModal(){
  const m=state.modal;
  const overlay=el('div',{className:'overlay',onClick:e=>e.target===e.currentTarget&&setState({modal:null})});
  let content;
  if(m.type==='createProject') content=buildCreateProjectModal();
  else if(m.type==='createTask') content=buildCreateTaskModal();
  else if(m.type==='createWorkspace') content=buildCreateWorkspaceModal();
  else if(m.type==='createEmployee') content=buildCreateEmployeeModal();
  else if(m.type==='resetPassword') content=buildResetPasswordModal();
  else if(m.type==='editShadowNote') content=buildEditShadowNoteModal();
  if(content) overlay.appendChild(content);
  return overlay;
}

function modalShell(title, children){
  const box=el('div',{className:'modal'});
  const head=el('div',{className:'modal-head'});
  head.appendChild(el('div',{className:'modal-title'},title));
  head.appendChild(el('button',{className:'close-btn',onClick:()=>setState({modal:null})},'×'));
  box.appendChild(head);
  children.forEach(c=>box.appendChild(c));
  return box;
}
function field(label, inp){ const f=el('div',{className:'field'}); f.appendChild(el('label',{className:'inp-label'},label)); f.appendChild(inp); return f; }
function inp(attrs={}){ return el('input',{className:'inp',...attrs}); }
function sel(options,attrs={}){ const s=el('select',{className:'inp',...attrs}); options.forEach(o=>{ const opt=el('option',{value:o},o); s.appendChild(opt); }); return s; }

function buildCreateProjectModal(){
  const nameI=inp({placeholder:'e.g. Wedding Event June 2026'});
  const clientI=inp({placeholder:'Client name (optional)'});
  const startI=inp({type:'date'});
  const endI=inp({type:'date'});
  const statusS=sel(['Planning','Active','On Hold','Completed','Archived']);
  const descT=el('textarea',{className:'inp',rows:'3',placeholder:'Internal project notes (admin only)...',style:{resize:'none'}});
  const saveBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:'4px'},onClick:async()=>{
    if(!nameI.value.trim()){ showToast('Project name required','error'); return; }
    const {data,error}=await db.from('projects').insert({name:nameI.value.trim(),client:clientI.value.trim()||null,start_date:startI.value||null,end_date:endI.value||null,status:statusS.value,description:descT.value.trim()||null,assigned_team:[]}).select().single();
    if(error){ showToast('Error: '+error.message,'error'); return; }
    await logAct('Created project: '+data.name);
    showToast('Project created! ✓');
    setState({modal:null});
    await loadAll();
  }},'Create Project');
  return modalShell('New Project',[
    field('Project Name',nameI),field('Client (Optional)',clientI),
    el('div',{className:'grid2'},[field('Start Date',startI),field('End Date',endI)]),
    field('Status',statusS),field('Description (Admin Only)',descT),saveBtn
  ]);
}

function buildCreateTaskModal(){
  const m=state.modal;
  const proj=m.project;
  const ws=m.workspace;
  const employees=state.users.filter(u=>u.role==='employee');
  const titleI=inp({placeholder:'Task title...'});
  const dueI=inp({type:'date'});
  const prioS=sel(['High','Medium','Low']);
  const assignS=el('select',{className:'inp'});
  assignS.appendChild(el('option',{value:''},'— Unassigned —'));
  employees.forEach(e=>{ const o=el('option',{value:e.id},e.name); assignS.appendChild(o); });
  const noteT=el('textarea',{className:'inp',rows:'3',placeholder:'Private notes (employee never sees this)...',style:{resize:'none'}});

  // Workspace selector
  const allWs=wsForProject(proj.id);
  const wsS=el('select',{className:'inp'});
  allWs.forEach(w=>{ const o=el('option',{value:w.id},w.month); if(ws&&w.id===ws.id) o.selected=true; wsS.appendChild(o); });

  const saveBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:'4px'},onClick:async()=>{
    if(!titleI.value.trim()){ showToast('Task title required','error'); return; }
    const selectedWsId=wsS.value;
    const {data,error}=await db.from('tasks').insert({workspace_id:selectedWsId,project_id:proj.id,title:titleI.value.trim(),due_date:dueI.value||null,priority:prioS.value,assigned_to:assignS.value||null,admin_notes:noteT.value.trim()||'',status:'Pending'}).select().single();
    if(error){ showToast('Error: '+error.message,'error'); return; }
    if(assignS.value){
      await pushNotif(assignS.value,`New task assigned: ${data.title} in ${proj.name}`);
    }
    await logAct('Created task: '+data.title+' in '+proj.name);
    showToast('Task created! ✓');
    setState({modal:null});
    await loadAll();
  }},'Create Task');
  return modalShell('New Task',[
    field('Task Title',titleI),
    field('Workspace',wsS),
    el('div',{className:'grid2'},[field('Due Date',dueI),field('Priority',prioS)]),
    field('Assign To',assignS),
    field('Private Admin Notes',noteT),
    saveBtn
  ]);
}

function buildCreateWorkspaceModal(){
  const proj=state.modal.project;
  const months=['January 2026','February 2026','March 2026','April 2026','May 2026','June 2026','July 2026','August 2026','September 2026','October 2026','November 2026','December 2026','January 2027','February 2027','March 2027','April 2027','May 2027','June 2027'];
  const monthS=sel(['— Select month —',...months]);
  const saveBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:'4px'},onClick:async()=>{
    if(monthS.value==='— Select month —'){ showToast('Select a month','error'); return; }
    await db.from('workspaces').insert({project_id:proj.id,month:monthS.value,status:'active'});
    await logAct('Added workspace: '+monthS.value+' to '+proj.name);
    showToast('Workspace created! ✓');
    setState({modal:null});
    await loadAll();
  }},'Create Workspace');
  return modalShell('Add Monthly Workspace',[field('Month',monthS),saveBtn]);
}

function buildCreateEmployeeModal(){
  const nameI=inp({placeholder:'Full name'});
  const emailI=inp({type:'email',placeholder:'employee@company.com'});
  const passI=inp({type:'password',placeholder:'Initial password'});
  const saveBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:'4px'},onClick:async()=>{
    if(!nameI.value.trim()||!emailI.value.trim()||!passI.value.trim()){ showToast('All fields required','error'); return; }
    const {error}=await db.from('users').insert({name:nameI.value.trim(),email:emailI.value.trim(),password:passI.value.trim(),role:'employee',avatar:ini(nameI.value.trim()),shadow_notes:''});
    if(error){ showToast('Error: '+error.message,'error'); return; }
    await logAct('Created employee: '+nameI.value.trim());
    showToast('Employee account created! ✓');
    setState({modal:null});
    await loadAll();
  }},'Create Account');
  return modalShell('Add Employee',[field('Full Name',nameI),field('Email',emailI),field('Password',passI),saveBtn]);
}

function buildResetPasswordModal(){
  const emp=state.modal.employee;
  const passI=inp({type:'password',placeholder:'New password'});
  const saveBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:'4px'},onClick:async()=>{
    if(!passI.value.trim()){ showToast('Enter a password','error'); return; }
    await db.from('users').update({password:passI.value.trim()}).eq('id',emp.id);
    await logAct('Reset password for: '+emp.name);
    showToast('Password reset for '+emp.name);
    setState({modal:null});
  }},'Reset Password');
  return modalShell('Reset Password: '+emp.name,[field('New Password',passI),saveBtn]);
}

function buildEditShadowNoteModal(){
  const emp=state.modal.employee;
  const noteT=el('textarea',{className:'inp',rows:'5',style:{resize:'none'}});
  noteT.value=emp.shadow_notes||'';
  noteT.placeholder='Performance observations, internal notes (never visible to employee)...';
  const notice=el('div',{style:{padding:'9px 11px',background:'rgba(108,99,255,.08)',border:'1px solid rgba(108,99,255,.15)',borderRadius:'7px',fontSize:'11px',color:'var(--accent2)',marginBottom:'14px'}},
    '🔒 This is a private internal record. The employee will never see this.');
  const saveBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:'4px'},onClick:async()=>{
    await db.from('users').update({shadow_notes:noteT.value}).eq('id',emp.id);
    state._selEmp={...emp,shadow_notes:noteT.value};
    showToast('Internal record updated ✓');
    setState({modal:null});
    await loadAll();
  }},'Save Record');
  return modalShell('Internal Record: '+emp.name,[notice,field('Notes',noteT),saveBtn]);
}

// ============================================================
// TOAST
// ============================================================
function renderToast(){
  const t=state.toast;
  return el('div',{className:`toast ${t.type}`},t.msg);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
